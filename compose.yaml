name: dinequeue
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinequeue}
      POSTGRES_DB: ${POSTGRES_DB:-dinequeue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      APP_ENV: development
      PORT: "8080"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with db as hostname in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      - api
volumes:
  postgres_data:
